independent_augs: false
dependence_key: "1 geometric per color"
augmentations:
  brightness:
    delta: [-0.3, 0.3]
    probability: 0.35
    is_geometric: false
  color_overlay:
    colors: [[80, 40, 20], [20, 120, 80], [200, 180, 50]]
    alpha: [0.3, 0.6]
    probability: 0.35
    is_geometric: false
  contrast:
    ratio: [0.7, 1.3]
    probability: 0.35
    is_geometric: false
  crop:
    keep_aspect_ratio: true
    ratio: [0.7, 0.9]
    is_geometric: true
  gamma:
    gamma_range: [40, 160]
    probability: 0.35
    is_geometric: false
  gaussian_blur:
    sigma: [1.0, 2.5]
    probability: 0.3
    is_geometric: false
  hue_shift:
    shift_limit: [-0.075, 0.075]
    probability: 0.35
    is_geometric: false
  motion_blur:
    kernel_size: [3, 7]
    probability: 0.3
    is_geometric: false
  occlusion:
    area_pct: [0.10, 0.20]
    probability: 0.3
    is_geometric: false
  rotation:
    degrees: [-10, 10]
    is_geometric: true
  scale:
    ratio: [0.8, 1.2]
    is_geometric: true
  saturation:
    ratio: [0.5, 1.5]
    probability: 0.35
    is_geometric: false
  shadow:
    intensity: [0.3, 0.7]
    probability: 0.3
    is_geometric: false
  translation:
    x_pct: [-0.1, 0.1]
    y_pct: [-0.1, 0.1]
    is_geometric: true
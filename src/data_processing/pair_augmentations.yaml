independent_augs: false
dependence_key: "1 geometric per color"
augmentations:
  brightness_contrast:
    brightness_limit: [-0.3, 0.3]
    contrast_limit: [-0.3, 0.3]
    probability: 0.4
    is_geometric: false
  crop:
    keep_aspect_ratio: true
    ratio: [0.7, 0.9]
    is_geometric: true
  gamma:
    gamma_limit: [40, 160]
    probability: 0.35
    is_geometric: false
  gaussian_blur:
    sigma_limit: [1.0, 2.5]
    probability: 0.25
    is_geometric: false
  hue_saturation:
    hue: [-0.075, 0.075]
    saturation: [0.5, 1.5]
    probability: 0.4
    is_geometric: false
  motion_blur:
    blur_limit: [3, 7]
    probability: 0.25
    is_geometric: false
  occlusion:
    area_pct: [0.10, 0.20]
    probability: 0.3
    is_geometric: false
  rotation:
    limit: [-10, 10]
    is_geometric: true
  scale:
    scale: [0.8, 1.2]
    is_geometric: true
  shadow:
    shadow_dimension: 5
    probability: 0.3
    is_geometric: false
  translation:
    translate_percent: [-0.1, 0.1]
    is_geometric: true
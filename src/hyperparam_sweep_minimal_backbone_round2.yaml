# hyperparam_sweep_minimal_backbone_round2.yaml
sweep_runs:
  # 1) Best template, WD sweep start low
  - name: run1_last_block_no_fpn_wd_0p015
    head_lr: 1e-4
    backbone_lr: 3e-6
    unfreeze_epoch: 12
    start_unfreeze: 17
    end_unfreeze: 18
    unfreeze_fpn: false
    warmup_epochs: 1
    unfreeze_warmup_epochs: 0.5
    weight_decay: 0.015
    batch_size: 32
    num_epochs: 30


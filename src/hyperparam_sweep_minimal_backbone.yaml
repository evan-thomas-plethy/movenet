# hyperparam_sweep_minimal_backbone.yaml
sweep_runs:
  # 0) CONTROL — head only (no unfreeze)
  - name: run0.1_head_only_control
    head_lr: 1e-4
    backbone_lr: 0.0
    unfreeze_epoch: 999
    start_unfreeze: 0
    end_unfreeze: 0
    unfreeze_fpn: false
    warmup_epochs: 1
    unfreeze_warmup_epochs: 0.0
    weight_decay: 0.05
    batch_size: 32
    num_epochs: 30

  # 1) Last block only, no FPN
  - name: run1_last_block_only_no_fpn
    head_lr: 1e-4
    backbone_lr: 3e-6
    unfreeze_epoch: 10
    start_unfreeze: 17
    end_unfreeze: 18
    unfreeze_fpn: false
    warmup_epochs: 1
    unfreeze_warmup_epochs: 0.5
    weight_decay: 0.05
    batch_size: 32
    num_epochs: 30

  # 2) Last block only, WITH FPN
  - name: run2_last_block_only_with_fpn
    head_lr: 1e-4
    backbone_lr: 3e-6
    unfreeze_epoch: 10
    start_unfreeze: 17
    end_unfreeze: 18
    unfreeze_fpn: true
    warmup_epochs: 1
    unfreeze_warmup_epochs: 0.5
    weight_decay: 0.05
    batch_size: 32
    num_epochs: 30

  # 3) Last two blocks, no FPN, stronger decay
  - name: run3_last_two_blocks_no_fpn_strong_decay
    head_lr: 1e-4
    backbone_lr: 5e-6
    unfreeze_epoch: 12
    start_unfreeze: 16
    end_unfreeze: 18
    unfreeze_fpn: false
    warmup_epochs: 1
    unfreeze_warmup_epochs: 0.5
    weight_decay: 0.05
    batch_size: 32
    num_epochs: 30

  # 4) Last two blocks, WITH FPN
  - name: run4_last_two_blocks_with_fpn
    head_lr: 1e-4
    backbone_lr: 2e-6
    unfreeze_epoch: 12
    start_unfreeze: 16
    end_unfreeze: 18
    unfreeze_fpn: true
    warmup_epochs: 1
    unfreeze_warmup_epochs: 0.5
    weight_decay: 0.05
    batch_size: 32
    num_epochs: 30

  # 5) Very late unfreeze, last block only
  - name: run5_very_late_last_block_no_fpn
    head_lr: 1e-4
    backbone_lr: 5e-6
    unfreeze_epoch: 15
    start_unfreeze: 17
    end_unfreeze: 18
    unfreeze_fpn: false
    warmup_epochs: 1
    unfreeze_warmup_epochs: 0.5
    weight_decay: 0.05
    batch_size: 32
    num_epochs: 30

  # 6) Mid+final blocks, WITH FPN
  - name: run6_mid_plus_final_with_fpn
    head_lr: 1e-4
    backbone_lr: 1e-6
    unfreeze_epoch: 12
    start_unfreeze: 12
    end_unfreeze: 18
    unfreeze_fpn: true
    warmup_epochs: 1
    unfreeze_warmup_epochs: 0.5
    weight_decay: 0.05
    batch_size: 32
    num_epochs: 30

  # 7) Early shallow unfreeze, no FPN
  - name: run7_early_shallow_no_fpn
    head_lr: 1e-4
    backbone_lr: 5e-6
    unfreeze_epoch: 6
    start_unfreeze: 17
    end_unfreeze: 18
    unfreeze_fpn: false
    warmup_epochs: 1
    unfreeze_warmup_epochs: 0.5
    weight_decay: 0.05
    batch_size: 32
    num_epochs: 30

  # 8) Early shallow unfreeze, WITH FPN
  - name: run8_early_shallow_with_fpn
    head_lr: 1e-4
    backbone_lr: 5e-6
    unfreeze_epoch: 6
    start_unfreeze: 17
    end_unfreeze: 18
    unfreeze_fpn: true
    warmup_epochs: 1
    unfreeze_warmup_epochs: 0.5
    weight_decay: 0.05
    batch_size: 32
    num_epochs: 30

  # 9) Slightly wider range (15–18), no FPN
  - name: run9_last_few_blocks_no_fpn
    head_lr: 1e-4
    backbone_lr: 4e-6
    unfreeze_epoch: 10
    start_unfreeze: 15
    end_unfreeze: 18
    unfreeze_fpn: false
    warmup_epochs: 1
    unfreeze_warmup_epochs: 0.5
    weight_decay: 0.05
    batch_size: 32
    num_epochs: 30

  # 10) Slightly wider range (15–18), WITH FPN
  - name: run10_last_few_blocks_with_fpn
    head_lr: 1e-4
    backbone_lr: 4e-6
    unfreeze_epoch: 10
    start_unfreeze: 15
    end_unfreeze: 18
    unfreeze_fpn: true
    warmup_epochs: 1
    unfreeze_warmup_epochs: 0.5
    weight_decay: 0.05
    batch_size: 32
    num_epochs: 30